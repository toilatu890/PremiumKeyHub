<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuX Hub | Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .hidden-view { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="dashboard-view" class="w-full max-w-4xl">
        <nav class="glass-panel rounded-2xl mb-6 p-4 flex justify-center items-center">
            <h1 class="text-2xl font-black text-blue-600">TuX<span class="text-gray-800">Store</span></h1>
        </nav>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-panel p-6 rounded-3xl text-center flex flex-col h-full">
                <h4 class="text-gray-500 font-bold mb-2 uppercase">Key 1 Tuần</h4>
                <div class="text-4xl font-black mb-4">10.000đ</div>
                <ul class="text-sm text-gray-600 space-y-2 mb-6 text-left flex-grow">
                    <li><i class="fa-solid fa-check text-green-500 mr-2"></i>Thẻ Viettel 10k</li>
                    <li><i class="fa-solid fa-check text-green-500 mr-2"></i>Hỗ trợ cập nhật</li>
                </ul>
                <button onclick="openPayment('Key 1 Tuần', '10.000đ')" class="w-full bg-blue-100 text-blue-700 py-3 rounded-xl font-bold hover:bg-blue-200 transition">MUA NGAY</button>
            </div>

            <div class="glass-panel p-6 rounded-3xl text-center border-2 border-blue-500 relative flex flex-col h-full transform md:-translate-y-2 shadow-xl">
                <span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-500 text-white text-[10px] font-black px-4 py-1 rounded-full">BÁN CHẠY</span>
                <h4 class="text-gray-500 font-bold mb-2 uppercase">Key 1 Tháng</h4>
                <div class="text-4xl font-black mb-4">20.000đ</div>
                <ul class="text-sm text-gray-600 space-y-2 mb-6 text-left flex-grow">
                    <li><i class="fa-solid fa-check text-green-500 mr-2"></i>Thẻ Viettel 20k</li>
                    <li><i class="fa-solid fa-check text-green-500 mr-2"></i>Ưu tiên support</li>
                </ul>
                <button onclick="openPayment('Key 1 Tháng', '20.000đ')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-500/30">MUA NGAY</button>
            </div>

            <div class="glass-panel p-6 rounded-3xl text-center flex flex-col h-full">
                <h4 class="text-gray-500 font-bold mb-2 uppercase">Key Vĩnh Viễn</h4>
                <div class="text-4xl font-black mb-4">50.000đ</div>
                <ul class="text-sm text-gray-600 space-y-2 mb-6 text-left flex-grow">
                    <li><i class="fa-solid fa-check text-green-500 mr-2"></i>Thẻ Viettel 50k</li>
                    <li><i class="fa-solid fa-check text-green-500 mr-2"></i>Dùng trọn đời</li>
                </ul>
                <button onclick="openPayment('Key Vĩnh Viễn', '50.000đ')" class="w-full bg-blue-100 text-blue-700 py-3 rounded-xl font-bold hover:bg-blue-200 transition">MUA NGAY</button>
            </div>
        </div>
    </div>

    <div id="payment-view" class="w-full max-w-md glass-panel p-8 rounded-3xl hidden-view">
        <button onclick="closePayment()" class="text-gray-400 hover:text-gray-700 mb-4"><i class="fa-solid fa-arrow-left mr-2"></i>Quay lại</button>
        <h2 class="text-2xl font-black text-gray-800 mb-2">Thanh Toán</h2>
        <p class="text-sm text-gray-500 mb-6">Bạn đang mua: <span id="selected-plan" class="font-bold text-blue-600"></span> (<span id="selected-price"></span>)</p>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase">Tên Nick Roblox</label>
                <input type="text" id="card-nick" class="w-full bg-blue-50 border border-blue-200 p-3 rounded-xl outline-none mt-1 font-bold" placeholder="Nhập tên nick của ông">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase">Loại thẻ</label>
                <select id="card-telco" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none mt-1">
                    <option>Viettel</option>
                    <option>Vinaphone</option>
                    <option>Mobifone</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase">Mã thẻ (PIN)</label>
                <input type="text" id="card-pin" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none mt-1" placeholder="Nhập mã thẻ">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase">Số Seri</label>
                <input type="text" id="card-seri" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none mt-1" placeholder="Nhập số seri">
            </div>
            <button onclick="submitPayment()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition shadow-lg shadow-green-500/30 mt-4">
                XÁC NHẬN NẠP THẺ
            </button>
        </div>
    </div>

    <div id="key-result-view" class="w-full max-w-md glass-panel p-8 rounded-3xl hidden-view text-center">
        <div class="text-5xl text-green-500 mb-4"><i class="fa-solid fa-circle-check"></i></div>
        <h2 class="text-2xl font-black text-gray-800 mb-2">Tạo Key Hoàn Tất!</h2>
        <p class="text-sm text-gray-500 mb-6">Key dưới đây chỉ hoạt động cho nick: <span id="display-nick" class="font-bold text-blue-600"></span></p>
        
        <div class="bg-gray-100 p-4 rounded-xl border border-gray-300 mb-6 relative">
            <p id="generated-key" class="font-mono text-lg font-bold text-gray-800 break-all"></p>
        </div>

        <button onclick="copyKey()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition shadow-lg shadow-green-500/30 mb-3">
            COPY KEY
        </button>
        <button onclick="backToHome()" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300 transition">
            VỀ TRANG CHỦ
        </button>
    </div>

    <script>
        function openPayment(plan, price) {
            document.getElementById('dashboard-view').classList.add('hidden-view');
            document.getElementById('payment-view').classList.remove('hidden-view');
            document.getElementById('selected-plan').innerText = plan;
            document.getElementById('selected-price').innerText = price;
        }

        function closePayment() {
            document.getElementById('payment-view').classList.add('hidden-view');
            document.getElementById('dashboard-view').classList.remove('hidden-view');
        }

        async function submitPayment() {
            const nick = document.getElementById('card-nick').value;
            const loaiThe = document.getElementById('card-telco').value;
            const pin = document.getElementById('card-pin').value;
            const seri = document.getElementById('card-seri').value;
            const giaText = document.getElementById('selected-price').innerText;
            const gia = giaText.replace(/\D/g, "");

            if (!nick || nick.length < 3) {
                return alert("Nhập Nick Roblox của ông đã sưng bro!");
            }
            if (pin.length < 5 || seri.length < 5) {
                return alert("Vui lòng nhập đầy đủ mã thẻ và seri sưng bro!");
            }

            // Tự động tạo Key ngay lúc nạp để gửi sang Backend lưu vào DB
            const randomStr = Math.floor(Math.random() * 900000) + 100000;
            const key = "TUX_" + randomStr;

            const btn = document.querySelector('button[onclick="submitPayment()"]');
            const originalText = btn.innerText;
            btn.innerText = "ĐANG CHECK THẺ...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loaiThe, pin, seri, gia, nick, key })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.msg);
                    // Chuyển thẳng sang trang hiện Key
                    document.getElementById('payment-view').classList.add('hidden-view');
                    document.getElementById('key-result-view').classList.remove('hidden-view');
                    document.getElementById('display-nick').innerText = nick;
                    document.getElementById('generated-key').innerText = key;
                } else {
                    alert("Lỗi: " + data.msg);
                }
            } catch (error) {
                alert("Lỗi kết nối máy chủ, thử lại sau sưng bro!");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function copyKey() {
            const keyText = document.getElementById('generated-key').innerText;
            navigator.clipboard.writeText(keyText);
            alert("Đã copy Key!");
        }

        function backToHome() {
            location.reload();
        }
    </script>
</body>
</html>
